<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeGuild</title>
    <script>
      // 首屏应用主题（localStorage > 系统偏好），避免亮色模式下闪深色
      ;(function () {
        var dark = true
        try {
          var saved = localStorage.getItem('copilot-theme')
          if (saved === 'light' || saved === 'dark') dark = saved === 'dark'
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {}
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      html { background: #f8fafc; }
      html.dark { background: #020617; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
